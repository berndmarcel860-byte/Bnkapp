# BnkApp — Nginx virtual-host configuration (combined)
# ============================================================================
# This file configures BOTH virtual hosts in a single file.
# If you prefer separate files per application, use instead:
#   • deploy/nginx-admin.conf  — admin panel only
#   • deploy/nginx-portal.conf — customer portal only
#
# DEPLOYMENT — follow these steps in order:
#
#   Step 1 — Edit this file before enabling it:
#     a. Replace /var/www/bnkapp with the absolute path to your BnkApp clone.
#     b. Replace admin.yourdomain.com and portal.yourdomain.com with real domains.
#     c. Verify your PHP-FPM socket path and update the fastcgi_pass lines:
#          PHP 8.3: unix:/var/run/php/php8.3-fpm.sock
#          PHP 8.2: unix:/var/run/php/php8.2-fpm.sock
#          PHP 8.1: unix:/var/run/php/php8.1-fpm.sock
#        Check your installed version: php --version
#        List available sockets:       ls /var/run/php/
#
#   Step 2 — Enable the site (HTTP only — no certificates needed yet):
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/bnkapp.conf
#     sudo ln -s /etc/nginx/sites-available/bnkapp.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
#   Step 3 — Obtain TLS certificates and enable HTTPS in one command:
#     sudo certbot --nginx -d admin.yourdomain.com -d portal.yourdomain.com
#     This issues a single multi-domain certificate covering both subdomains.
#     To use separate certificates instead, run certbot once per domain:
#       sudo certbot --nginx -d admin.yourdomain.com
#       sudo certbot --nginx -d portal.yourdomain.com
#     Certbot automatically edits this file to add SSL directives and the
#     HTTP→HTTPS redirect. No manual SSL configuration is required.
# ============================================================================

# ── Admin Panel (HTTP — Certbot upgrades this block to HTTPS) ─────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.yourdomain.com;

    root /var/www/bnkapp/app/admin/public;
    index index.php;

    # Custom 404 — serve the admin app instead of a blank error page
    error_page 404 /index.php;

    # Single entry-point routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM — adjust socket path to match your installed PHP version
    location ~ \.php$ {
        fastcgi_pass        unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index       index.php;
        fastcgi_param       SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include             fastcgi_params;
    }

    # Deny access to hidden files (e.g. .htaccess, .git)
    location ~ /\. { deny all; }
}

# ── Customer Portal (HTTP — Certbot upgrades this block to HTTPS) ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name portal.yourdomain.com;

    root /var/www/bnkapp/app/portal/public;
    index index.php;

    # Custom 404 — redirect unknown routes to the portal login page
    error_page 404 /index.php;

    # Single entry-point routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM — adjust socket path to match your installed PHP version
    location ~ \.php$ {
        fastcgi_pass        unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index       index.php;
        fastcgi_param       SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include             fastcgi_params;
    }

    # Deny access to hidden files (e.g. .htaccess, .git)
    location ~ /\. { deny all; }
}
