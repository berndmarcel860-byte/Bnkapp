# BnkApp — Nginx virtual-host configuration (combined)
# ============================================================================
# This file configures BOTH virtual hosts in a single file.
# If you prefer separate files per application, use instead:
#   • deploy/nginx-admin.conf  — admin panel only
#   • deploy/nginx-portal.conf — customer portal only
#
# Two virtual hosts are required:
#   • admin.yourdomain.com  → app/admin/public/
#   • portal.yourdomain.com → app/portal/public/
#
# Before using this file:
#   1. Replace /var/www/bnkapp with the absolute path to your BnkApp clone.
#   2. Replace admin.yourdomain.com and portal.yourdomain.com with real domains.
#   3. Verify your PHP-FPM socket path and update the fastcgi_pass lines:
#        PHP 8.3: unix:/var/run/php/php8.3-fpm.sock
#        PHP 8.2: unix:/var/run/php/php8.2-fpm.sock
#        PHP 8.1: unix:/var/run/php/php8.1-fpm.sock
#      Check your installed version: php --version
#      List available sockets:       ls /var/run/php/
#   4. Obtain TLS certificates (see step 6 below).
#
# Quick setup:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bnkapp.conf
#   sudo ln -s /etc/nginx/sites-available/bnkapp.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.yourdomain.com -d portal.yourdomain.com
# ============================================================================

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.yourdomain.com portal.yourdomain.com;

    # Allow Let's Encrypt ACME challenges before redirecting.
    # The directory /var/www/letsencrypt must exist and be readable by Nginx.
    # Create it with: sudo mkdir -p /var/www/letsencrypt
    # When using the webroot plugin: certbot certonly --webroot -w /var/www/letsencrypt -d ...
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Admin Panel ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.yourdomain.com;

    root /var/www/bnkapp/app/admin/public;
    index index.php;

    # TLS — certificates are managed by Certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/admin.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Single entry-point routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM — adjust socket path to match your installed PHP version
    location ~ \.php$ {
        fastcgi_pass        unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index       index.php;
        fastcgi_param       SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include             fastcgi_params;
    }

    # Deny access to hidden files (e.g. .htaccess, .git)
    location ~ /\. { deny all; }
}

# ── Customer Portal ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal.yourdomain.com;

    root /var/www/bnkapp/app/portal/public;
    index index.php;

    # TLS — certificates are managed by Certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/portal.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Single entry-point routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM — adjust socket path to match your installed PHP version
    location ~ \.php$ {
        fastcgi_pass        unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index       index.php;
        fastcgi_param       SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include             fastcgi_params;
    }

    # Deny access to hidden files (e.g. .htaccess, .git)
    location ~ /\. { deny all; }
}
