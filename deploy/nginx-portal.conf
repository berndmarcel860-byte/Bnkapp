# BnkApp — Customer Portal Nginx configuration
# ============================================================================
# Drop this file into /etc/nginx/sites-available/bnkapp-portal.conf and enable
# it with a symlink. It covers only the customer self-service portal virtual host.
#
# Before using this file:
#   1. Replace /var/www/bnkapp with the absolute path to your BnkApp clone.
#   2. Replace portal.yourdomain.com with your real portal domain/subdomain.
#   3. Verify your PHP-FPM socket path and update the fastcgi_pass line:
#        PHP 8.3: unix:/var/run/php/php8.3-fpm.sock
#        PHP 8.2: unix:/var/run/php/php8.2-fpm.sock
#        PHP 8.1: unix:/var/run/php/php8.1-fpm.sock
#      Check your installed version: php --version
#      List available sockets:       ls /var/run/php/
#   4. Obtain a TLS certificate for portal.yourdomain.com with Certbot.
#
# Quick setup:
#   sudo cp deploy/nginx-portal.conf /etc/nginx/sites-available/bnkapp-portal.conf
#   sudo ln -s /etc/nginx/sites-available/bnkapp-portal.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d portal.yourdomain.com
# ============================================================================

# ── HTTP → HTTPS redirect (portal) ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name portal.yourdomain.com;

    # Allow Let's Encrypt ACME challenges before redirecting.
    # The directory /var/www/letsencrypt must exist and be readable by Nginx.
    # Create it with: sudo mkdir -p /var/www/letsencrypt
    # When using the webroot plugin: certbot certonly --webroot -w /var/www/letsencrypt -d ...
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Customer Portal (HTTPS) ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal.yourdomain.com;

    root /var/www/bnkapp/app/portal/public;
    index index.php;

    # TLS — certificates are managed by Certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/portal.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Custom 404 — redirect unknown routes to the portal login page
    error_page 404 /index.php;

    # Single entry-point routing — all requests go through index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM — adjust socket path to match your installed PHP version
    location ~ \.php$ {
        fastcgi_pass        unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index       index.php;
        fastcgi_param       SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include             fastcgi_params;
    }

    # Deny access to hidden files (e.g. .htaccess, .git)
    location ~ /\. { deny all; }
}
